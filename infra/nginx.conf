upstream api { server backend:8080; }
upstream web { server frontend:80; }
server {
  listen 80;
  client_max_body_size 1300m;
  location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /health { proxy_pass http://api; }
  location /swagger { proxy_pass http://api; }
  location / { proxy_pass http://web; proxy_set_header Host $host; }
}
